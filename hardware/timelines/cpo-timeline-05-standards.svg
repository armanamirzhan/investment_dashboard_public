<text x="579.3599999999872" y="190.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#5a6a7e">Common plugs and modules across</text>
<text x="579.3599999999872" y="203.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#5a6a7e">suppliers</text>
