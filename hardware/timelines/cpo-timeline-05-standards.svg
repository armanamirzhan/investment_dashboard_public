<circle cx="1043.1999999999998" cy="310" r="7.5" fill="#1e40af" stroke="#fff" stroke-width="2.2"/>
<rect x="909.1999999999998" y="129" width="268" height="86" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
<text x="919.1999999999998" y="146" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#2b6cb0">Protocols</text>
<text x="919.1999999999998" y="161" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.2" font-weight="600" fill="#1a2332">Optical protocols less settled than</text>
<text x="919.1999999999998" y="175.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.2" font-weight="600" fill="#1a2332">copper SerDes</text>
<text x="919.1999999999998" y="190.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#5a6a7e">Serializer/deserializer (SerDes)</text>
<text x="919.1999999999998" y="203.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#5a6a7e">copper still more mature</text>
<rect x="52" y="565" width="1416" height="112" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text x="70" y="591" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0d9488" letter-spacing="0.08em">END STATE</text>
<text x="70" y="615" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#1a2332">Settled cross-vendor optical I/O standards — Universal Chiplet Interconnect Express (UCIe), laser</text>
<text x="70" y="637" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#1a2332">multi-source agreements (MSAs), and optical protocols as interchangeable as copper</text>
<text x="70" y="659" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#1a2332">serializer/deserializer (SerDes).</text>
<text x="760.0" y="712" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#64748b">Not investment advice.</text>
