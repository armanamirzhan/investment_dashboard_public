<text x="211.2" y="161" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.2" font-weight="600" fill="#1a2332">Universal Chiplet Interconnect</text>
<text x="211.2" y="175.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.2" font-weight="600" fill="#1a2332">Express (UCIe)</text>
<text x="211.2" y="190.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#5a6a7e">Die-to-optical-chiplet electrical</text>
<text x="211.2" y="203.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#5a6a7e">bridge</text>
